<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="163.0mm" viewBox="0 0 1500 1630">
<title>연구 모형: H1 공분산분석과 H2 상호작용 분석</title>
<rect width="1500" height="100%" fill="white"/>
<text x="50" y="65" font-family="Malgun Gothic" font-size="44" font-weight="700" fill="#243C55" text-anchor="start">H1  두 집단 공분산분석(ANCOVA)</text>
<text x="50" y="123" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="start">공변량 조정 후 안전관리 실효성의 집단 간 평균 비교</text>
<rect x="50" y="180" width="530" height="190" fill="#F2F4F6" stroke="#243C55" stroke-width="3"/>
<text x="315" y="235" font-family="Malgun Gothic" font-size="30" font-weight="700" fill="#20262D" text-anchor="middle">YOLO-LLM 안전관제 시스템</text>
<text x="315" y="295" font-family="Malgun Gothic" font-size="32" font-weight="400" fill="#20262D" text-anchor="middle">도입 집단 구분(D): 도입</text>
<rect x="50" y="420" width="530" height="190" fill="#F2F4F6" stroke="#243C55" stroke-width="3"/>
<text x="315" y="475" font-family="Malgun Gothic" font-size="30" font-weight="700" fill="#20262D" text-anchor="middle">YOLO-LLM 안전관제 시스템</text>
<text x="315" y="535" font-family="Malgun Gothic" font-size="32" font-weight="400" fill="#20262D" text-anchor="middle">도입 집단 구분(D): 미도입</text>
<polyline points="580,275 650,275 650,515 580,515" fill="none" stroke="#243C55" stroke-width="3"/>
<polyline points="650,395 825,395" fill="none" stroke="#243C55" stroke-width="3"/>
<polygon points="825,395 807.0,386.0 807.0,404.0" fill="#243C55"/>
<text x="736" y="350" font-family="Malgun Gothic" font-size="36" font-weight="700" fill="#20262D" text-anchor="middle">비교</text>
<rect x="825" y="180" width="625" height="430" fill="white" stroke="#243C55" stroke-width="3"/>
<text x="1137" y="243" font-family="Malgun Gothic" font-size="42" font-weight="700" fill="#20262D" text-anchor="middle">안전관리 실효성(Y)</text>
<text x="1137" y="304" font-family="Malgun Gothic" font-size="36" font-weight="700" fill="#20262D" text-anchor="middle">전체 점수의 조정 평균</text>
<text x="1137" y="376" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="middle">조기인지 · 대응 신속성</text>
<text x="1137" y="432" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="middle">원격 파악 · 순찰부담 경감</text>
<text x="1137" y="488" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="middle">위험 통제력</text>
<text x="1137" y="566" font-family="Malgun Gothic" font-size="34" font-weight="400" fill="#58616B" text-anchor="middle">하위요인 분석은 보조 결과</text>
<rect x="380" y="735" width="1070" height="175" fill="#F2F4F6" stroke="#243C55" stroke-width="3"/>
<text x="415" y="790" font-family="Malgun Gothic" font-size="38" font-weight="700" fill="#243C55" text-anchor="start">공변량 조정</text>
<text x="415" y="844" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="start">연속 공변량 2: 만 나이 · 건설현장 경력</text>
<text x="415" y="891" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="start">범주형 요인 4: 소속 · 성별 · 역할 · 총공사비 구간</text>
<polyline points="1137,735 1137,610" fill="none" stroke="#243C55" stroke-width="3"/>
<polygon points="1137,610 1128.0,628.0 1146.0,628.0" fill="#243C55"/>
<text x="50" y="990" font-family="Malgun Gothic" font-size="42" font-weight="700" fill="#243C55" text-anchor="start">H2  상호작용 일반선형모형</text>
<rect x="50" y="1035" width="1400" height="365" fill="white" stroke="#243C55" stroke-width="3" stroke-dasharray="14 10"/>
<text x="90" y="1100" font-family="Malgun Gothic" font-size="38" font-weight="700" fill="#20262D" text-anchor="start">안전관리 예산 제약성(W)</text>
<text x="90" y="1150" font-family="Malgun Gothic" font-size="36" font-weight="400" fill="#20262D" text-anchor="start">집단 및 W의 주효과와 공변량을 포함한 상호작용 모형</text>
<rect x="90" y="1195" width="690" height="95" fill="#F2F4F6" stroke="#243C55" stroke-width="3" stroke-dasharray="14 10"/>
<text x="435" y="1256" font-family="Malgun Gothic" font-size="38" font-weight="700" fill="#20262D" text-anchor="middle">집단 × 예산 제약성(W)</text>
<polyline points="780,1242 1000,1242" fill="none" stroke="#243C55" stroke-width="3" stroke-dasharray="14 10"/>
<polygon points="1000,1242 982.0,1233.0 982.0,1251.0" fill="#243C55"/>
<text x="1220" y="1256" font-family="Malgun Gothic" font-size="36" font-weight="700" fill="#20262D" text-anchor="middle">안전관리 실효성(Y)</text>
<text x="90" y="1355" font-family="Malgun Gothic" font-size="35" font-weight="400" fill="#20262D" text-anchor="start">검정력 제약을 고려하여 방향·효과크기·신뢰구간 중심 해석</text>
<text x="50" y="1465" font-family="Malgun Gothic" font-size="34" font-weight="400" fill="#20262D" text-anchor="start">실선: 주 분석 및 공변량 조정 / 점선: W 상호작용 분석</text>
<text x="50" y="1520" font-family="Malgun Gothic" font-size="34" font-weight="400" fill="#20262D" text-anchor="start">화살표는 분석 관계를 표시하며 인과관계의 입증을 뜻하지 않는다.</text>
<text x="50" y="1575" font-family="Malgun Gothic" font-size="34" font-weight="400" fill="#20262D" text-anchor="start">사후 설문 1회의 횡단 비교 · 현장당 1명·총 60명 모집 목표</text>
</svg>